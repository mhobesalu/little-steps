/* VOICE  calm, warm, for a child and a tired parent: few words, big pictures
   IDEA   the laminated picture-card strip therapists stick on a fridge: one card now, the next card waiting
   PICTURE the current step's card, drawn large, with a soft ring that drains as the gentle timer runs
   COLOUR each routine owns one colour field (sunrise orange, sky blue, night indigo) on warm white; card stays white
   TYPE   Fredoka for labels and titles, Nunito for grown-up text
   LAYOUT phone: card centre, Done + Next up beneath; laptop/landscape: card left, Next up and Done right */
:root{color-scheme:light dark;--bg:light-dark(#fff8ee,#16142b);--ink:light-dark(#241f3d,#f3f0ff);--soft:light-dark(#6d6788,#b9b3d6);--panel:light-dark(#ffffff,#221f3d);--line:light-dark(#ece4d6,#37335a);--card:#ffffff;--cardink:#241f3d;--c:#ff9f1c}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--c);outline-offset:3px}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;line-height:1.05;letter-spacing:-.01em;margin:0}
#app{height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
svg.pic{width:100%;height:100%;display:block}
.home{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:18px;max-width:1100px;width:100%;margin:0 auto}
.home h1{font-size:clamp(34px,6vw,52px);padding-top:8px}
.home h1 small{display:block;font:700 17px/1.4 Nunito,sans-serif;color:var(--soft);margin-top:6px;letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px;align-content:center;overflow:auto;min-height:0;padding:12px 6px}
.tile{--c:#ff9f1c;position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 14px 20px;border-radius:28px;background:color-mix(in srgb,var(--c) 22%,var(--panel));box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 45%,transparent);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ico{width:min(150px,34vw);aspect-ratio:1;background:var(--card);border-radius:24px;padding:10px;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 50%,#0003)}
.tile b{font:600 clamp(20px,2.6vw,28px)/1.1 Fredoka,sans-serif;text-align:center}
.tile .st{font-weight:800;font-size:14px;color:var(--soft);min-height:21px}
.tile.now{outline:4px solid var(--c);outline-offset:3px}
.tile .badge{position:absolute;top:-10px;left:50%;translate:-50% 0;background:var(--c);color:#241f3d;font:700 14px/1 Fredoka,sans-serif;padding:7px 14px;border-radius:99px;white-space:nowrap}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--soft);font-size:14px}
.gear{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);flex:none}
.gear svg{width:28px;height:28px}
.gear::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(var(--ink) var(--p,0%),transparent 0);-webkit-mask:radial-gradient(circle,transparent 29px,#000 30px);mask:radial-gradient(circle,transparent 29px,#000 30px);opacity:.8}
.gear.holding::after{animation:hold 1.2s linear forwards}
@property --p{syntax:"<percentage>";inherits:false;initial-value:0%}
@keyframes hold{to{--p:100%}}
.hint{font-size:13px}
.run{flex:1;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:12px;margin:calc(-1*max(14px,env(safe-area-inset-top))) calc(-1*max(16px,env(safe-area-inset-right))) calc(-1*max(14px,env(safe-area-inset-bottom))) calc(-1*max(16px,env(safe-area-inset-left)));padding:inherit;background:color-mix(in srgb,var(--c) 26%,var(--bg))}
.bar{display:flex;align-items:center;gap:12px}
.bar h2{flex:1;font-size:clamp(22px,3.4vw,32px);text-align:center}
.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--panel);flex:none;box-shadow:0 3px 0 #0001}
.round svg{width:26px;height:26px}

.strip{display:flex;gap:6px;justify-content:center;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.strip li{width:34px;height:34px;border-radius:10px;background:var(--card);padding:3px;position:relative;opacity:.55;transition:.2s}

.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;align-items:center;gap:14px;min-height:0}
.cardwrap{--s:min(76vw,44svh,400px);position:relative;width:var(--s);height:var(--s)}
.sand{position:absolute;left:8%;right:8%;bottom:-34px;height:14px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,var(--panel));overflow:hidden}
.sand i{display:block;height:100%;width:100%;border-radius:99px;background:var(--c);transition:width 1s linear}
.card{position:absolute;inset:0;border-radius:34px;background:var(--card);color:var(--cardink);display:grid;grid-template-rows:minmax(0,1fr) auto;padding:6% 6% 5%;box-shadow:0 8px 0 color-mix(in srgb,var(--c) 55%,#0002),0 18px 30px -14px #0004}
.card span{font:600 clamp(24px,calc(var(--s)*.1),40px)/1.05 Fredoka,sans-serif;text-align:center;text-wrap:balance}

.side{display:flex;flex-direction:column;gap:12px;width:min(100%,460px);justify-self:center}
.done{display:flex;align-items:center;justify-content:center;gap:12px;min-height:76px;border-radius:26px;background:var(--ink);color:var(--bg);font:700 30px/1 Fredoka,sans-serif;box-shadow:0 6px 0 color-mix(in srgb,var(--ink) 60%,var(--c))}
.done:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 60%,var(--c))}
.done svg{width:36px;height:36px}
.next{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:22px;background:color-mix(in srgb,var(--panel) 80%,transparent)}

.next small{display:block;font-weight:800;font-size:14px;color:var(--soft)}
.next b{font:600 21px/1.15 Fredoka,sans-serif}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;overflow:auto;width:min(100%,560px);justify-self:center;align-self:start;max-height:100%}
.list li button{width:100%;display:flex;align-items:center;gap:14px;padding:8px 14px 8px 8px;border-radius:20px;background:var(--panel);text-align:start;font:600 21px/1.15 Fredoka,sans-serif}
.list .mini{width:54px;height:54px;flex:none;background:var(--card);border-radius:14px;padding:4px}
.list .bx{margin-inline-start:auto;width:38px;height:38px;border-radius:12px;border:3px solid var(--line);flex:none;display:grid;place-items:center}
.list .ok button{opacity:.55}
.list .ok .bx{background:var(--c);border-color:var(--c)}
.list .now button{outline:3px solid var(--ink)}
.cheer{flex:1;display:grid;place-items:center;align-content:center;gap:22px;text-align:center;margin:calc(-1*max(14px,env(safe-area-inset-top))) calc(-1*max(16px,env(safe-area-inset-right))) calc(-1*max(14px,env(safe-area-inset-bottom))) calc(-1*max(16px,env(safe-area-inset-left)));padding:24px;background:color-mix(in srgb,var(--c) 30%,var(--bg))}
.cheer .big{width:min(62vw,40svh,320px);aspect-ratio:1}
.cheer h1{font-size:clamp(40px,8vw,64px)}
.cheer p{margin:0;font:600 22px/1.3 Fredoka,sans-serif;color:var(--soft)}
.cheer .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pill{min-height:56px;padding:0 26px;border-radius:99px;background:var(--ink);color:var(--bg);font:600 21px/1 Fredoka,sans-serif}
.pill.ghost{background:var(--panel);color:var(--ink)}
.burst{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.star{position:fixed;left:50%;top:45%;width:120px;height:120px;margin:-60px;pointer-events:none;animation:fly .7s ease-out forwards;z-index:5}
@keyframes fly{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:translateY(-38vh) scale(.5);opacity:0}}
#sheet{position:fixed;inset:0;z-index:10;background:#0007;display:flex;justify-content:center;align-items:flex-end}
#sheet[hidden]{display:none}
.pane{background:var(--bg);width:min(100%,720px);max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:22px max(18px,env(safe-area-inset-left)) max(24px,env(safe-area-inset-bottom));user-select:text;-webkit-user-select:text}

.pane h2{font-size:32px;display:flex;justify-content:space-between;align-items:center;gap:12px}

.set{display:grid;gap:10px;background:var(--panel);border-radius:20px;padding:14px}
.fld{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:44px}
.fld label{font-weight:800}
input[type=text],select{font:600 16px Nunito,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px;border:2px solid var(--line)}
.seg button{padding:8px 16px;border-radius:10px;font-weight:800;min-height:40px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sw{width:58px;height:34px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.sw[aria-checked=true]{background:#3aa86b}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:99px;background:var(--panel);font-weight:800;min-height:44px;border:2px solid transparent}
.tabs button[aria-pressed=true]{border-color:var(--ink)}
.tabs .mini{width:32px;height:32px;background:var(--card);border-radius:50%;padding:2px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--bg);border-radius:16px;padding:6px}

.steps input{width:100%}
.steps .mv{display:flex;gap:2px}
.steps .mv button{width:40px;height:44px;border-radius:10px;display:grid;place-items:center}

.add{margin-top:10px;width:100%;min-height:50px;border-radius:16px;border:2px dashed var(--soft);font-weight:800}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:10px}
.pick button{background:var(--bg);border-radius:16px;padding:8px 4px;display:grid;justify-items:center;gap:4px;font-size:13px;font-weight:800;line-height:1.15;text-align:center}
.pick .mini{width:56px;height:56px;background:var(--card);border-radius:12px;padding:3px}
.x{width:48px;height:48px;border-radius:50%;background:var(--panel);font-size:26px;line-height:1}

}

<script>
{

 if(a==='addc'){r.steps.push({c:b.dataset.v,m:0,label:''});tone([[784,0,.3]]);if(b.dataset.v==='star'){save();drawSheet();const ins=sheet.querySelectorAll('[data-lab]');ins[ins.length-1]?.focus();return}}
 if(a==='restart'){S.prog[r.id]={i:0,at:Date.now(),done:false}}
 if(a==='delr'){if(!edit.delR){edit.delR=true;drawSheet();return}S.routines=S.routines.filter(x=>x!==r);delete S.prog[r.id];edit={r:S.routines[0].id,pick:false,reset:false,icon:false,delR:false}}
 else if(a!=='tab')edit.delR=false;
 if(a==='reset'){if(!edit.reset){edit.reset=true;drawSheet();return}const keep={lang:S.lang,unlocked:S.unlocked};S=Object.assign(DEF(),keep);edit={r:S.routines[0].id,pick:false,reset:false,icon:false,delR:false}}
 else edit.reset=false;
 if(['up','down','del','restart','addc'].includes(a)){const p=S.prog[r.id];if(p&&p.i>=r.steps.length){p.i=Math.max(0,r.steps.length-1)}}
 gcPhotos();save();drawSheet();
});

/* ---------- One-time unlock (App Store / Google Play), behind a grown-up check ---------- */
const modal=document.getElementById('modal');
let price='';
const shop=m=>window.Capacitor.nativePromise('Store',m,{});
async function syncStore(){
 if(!NATIVE)return;
 try{const r=await shop('isUnlocked');setUnlocked(r.unlocked)}catch(e){}
 if(!price){try{const p=await shop('getProduct');price=p.price||''}catch(e){}}
 try{window.Capacitor.Plugins?.Store?.addListener?.('entitlement',d=>setUnlocked(d.unlocked))}catch(e){}
}
function setUnlocked(v){const was=!!S.unlocked;S.unlocked=!!v;save();if(was!==S.unlocked){if(!sheet.hidden)drawSheet();draw()}}
function openUnlock(){
 modal.hidden=false;
 modal.innerHTML=`<div class="pane unl" role="dialog" aria-modal="true" aria-label="${t('unlockT')}"><div class="big">${svg('star')}</div><h2>${t('unlockT')}</h2>
 <ul class="ul">${['u1','u2','u3'].map(k=>`<li>${ICON.check}<span>${t(k)}</span></li>`).join('')}</ul><p class="note">${t('uPrice')}</p>
 <button class="pill" data-act="buy">${price?t('buyP',{p:esc(price)}):t('buy')}</button><button class="pill ghost" data-act="restore">${t('restore')}</button><button class="lnk" data-act="mclose">${t('notNow')}</button><p class="msg" id="umsg"></p></div>`;
}
/* Grown-up check before any purchase: a times-table question a young child can't answer. */
function gate(then){
 const a=4+Math.floor(Math.random()*6),b=4+Math.floor(Math.random()*6),ok=a*b;
 const opts=new Set([ok]);while(opts.size<4)opts.add(ok+(Math.floor(Math.random()*9)-4)*(1+Math.floor(Math.random()*2)));
 const back=modal.innerHTML;
 modal.innerHTML=`<div class="pane unl" role="dialog" aria-modal="true" aria-label="${t('gateT')}"><h2>${t('gateT')}</h2><p class="q">${t('gateQ',{a,b})}</p><div class="ans">${[...opts].sort(()=>Math.random()-.5).map(n=>`<button data-ans="${n}">${n}</button>`).join('')}</div><button class="lnk" data-act="mclose">${t('notNow')}</button></div>`;
 modal.onanswer=n=>{modal.onanswer=null;if(n===ok){modal.innerHTML=back;then()}else{modal.hidden=true}};
}
async function doStore(m){
 const msg=()=>document.getElementById('umsg');
 if(!NATIVE){setUnlocked(true);modal.hidden=true;return}
 modal.querySelectorAll('button').forEach(x=>x.disabled=true);msg().textContent=m==='purchase'?t('talking'):t('checking');
 try{const r=await shop(m);
  if(r.unlocked){setUnlocked(true);msg().textContent=t('thanks');tone([[523,0],[659,.12],[784,.24]]);setTimeout(()=>{modal.hidden=true},1400);return}
  msg().textContent=r.pending?t('pending'):r.cancelled?'':m==='restore'?t('noBuy'):t('failBuy');
 }catch(e){msg().textContent=t('noStore')}
 modal.querySelectorAll('button').forEach(x=>x.disabled=false);
}
modal.addEventListener('click',e=>{
 if(e.target===modal){modal.hidden=true;return}
 const n=e.target.closest('[data-ans]');if(n&&modal.onanswer)return modal.onanswer(+n.dataset.ans);
 const b=e.target.closest('[data-act]');if(!b)return;
 if(b.dataset.act==='mclose')modal.hidden=true;
 if(b.dataset.act==='buy')gate(()=>doStore('purchase'));
 if(b.dataset.act==='restore')gate(()=>doStore('restore'));
});

/* ---------- Kid taps ---------- */
app.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='unlock')return openUnlock();
 if(a==='home'){view={v:'home'};draw()}
 if(a==='done')complete();
 if(a==='say'){const r=R(view.id);sayStep(r.steps[prog(view.id).i])}
 if(a==='mode'){S.listMode=!S.listMode;save();draw()}
 if(a==='again')go(b.dataset.id);
 if(a==='tickrow'){const p=prog(view.id),i=+b.dataset.i;if(i===p.i)complete();else if(i<p.i){p.i=i;p.at=Date.now();save();draw()}}
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!modal.hidden)modal.hidden=true;else if(!sheet.hidden)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw()});
draw();syncStore();
}
</script>
